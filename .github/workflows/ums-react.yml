name: React CI

on:
  push:
    paths:
      - "ums-react/**"
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"
  pull_request:
    paths:
      - "ums-react/**"
    branches:
      - main
      - develop
      - "release/**"
      - "hotfix/**"
      - "feature/**"

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ums-react

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '8.15.4'

      - name: Cache pnpm store
        uses: actions/cache@v3
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install

      - name: Type Check
        run: pnpm run type-check

      - name: Run Lint
        run: pnpm run lint

      - name: Build React App
        run: pnpm run build
